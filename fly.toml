# fly.toml — gRPC ObjectStore (shared-IPv4-friendly config)
#
# Uses Fly's HTTP proxy with h2_backend = true:
#   client --TLS/HTTP2--> Fly edge --cleartext HTTP/2 (h2c)--> app:50051
# This works on the FREE shared IPv4 (no dedicated IP needed) because the
# HTTP proxy natively negotiates h2 via ALPN at the edge.

app = "grpc-objectstore"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 50051
  force_https = true

  # Watch demo needs one always-on machine (in-memory store + live streams).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    # CRITICAL: tells Fly's proxy the app speaks cleartext HTTP/2 (gRPC).
    h2_backend = true

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
