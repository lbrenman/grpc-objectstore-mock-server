# fly.toml — gRPC ObjectStore
#
# Key idea: Fly's edge terminates TLS and (via alpn = ["h2"]) negotiates HTTP/2
# with the client, then forwards cleartext HTTP/2 (h2c) to the app on the
# internal port. Your gRPC client connects with normal TLS credentials to
# <app>.fly.dev:443 — no certs needed in your app code.

app = "grpc-objectstore"   # change to a globally unique name before deploy
primary_region = "ewr"     # pick a region near you: https://fly.io/docs/reference/regions/

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 50051

  # IMPORTANT for the watch demo: keep exactly one machine running.
  # The store is in-memory, and watchers + creators must hit the SAME machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls"]

    [services.ports.tls_options]
      alpn = ["h2"]

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
